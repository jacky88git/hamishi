<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>חמישי הרכב - השירים שלנו</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #D4AC0D			;
            --text-main: #ffffff;
            --text-sec: #D4AC0D		;
            --danger: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--surface-color);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header-content h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .screen { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* סרגל כפתורי יבוא/יצוא */
        .tools-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tool-btn {
            flex: 1;
            background-color: var(--surface-color);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 12px 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .tool-btn:active {
            background-color: #2a2a2a;
        }

        .song-list { list-style: none; }
        .song-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .song-card:active { transform: scale(0.98); }
        .song-title-wrap { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .drag-handle {
            color: #666;
            font-size: 1.3rem;
            padding: 8px;
            margin: -8px;
            cursor: grab;
            touch-action: none;
            flex-shrink: 0;
        }
        .drag-handle:active { cursor: grabbing; color: var(--primary-color); }
        .song-card.sortable-ghost { opacity: 0.3; }
        .song-card.sortable-chosen { box-shadow: 0 6px 18px rgba(212,172,13,0.35); }
        .song-title { font-size: 1.4rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .song-key-badge {
            background-color: var(--primary-color);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.2rem;
            direction: ltr;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: var(--primary-color);
            color: #000;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            cursor: pointer;
            z-index: 9999;
            border: none;
            outline: none;
        }
        .fab i {
            pointer-events: none;
        }

        .detail-header { text-align: center; margin-bottom: 20px; }
        .detail-title { font-size: 2.5rem; color: var(--primary-color); margin-bottom: 10px; }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .info-box {
            background-color: var(--surface-color);
            padding: 15px 5px;
            border-radius: 10px;
            text-align: center;
        }
        .info-box span { display: block; color: var(--text-sec); font-size: 0.95rem; margin-bottom: 5px; }
        .info-box strong { font-size: 1.4rem; direction: ltr; display: block;}
        
        .notes-section {
            background-color: #2a2a2a;
            border-right: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .audio-list-container { margin-bottom: 25px; }
        .audio-item {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .audio-item span {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: var(--primary-color);
            font-weight: bold;
        }
        .audio-item iframe {
            width: 100%;
            border: none;
            border-radius: 8px;
            display: block;
        }
        .audio-item a.media-link-btn {
            display: block;
            text-align: center;
            background-color: var(--primary-color);
            color: #000;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .edit-audio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        .edit-audio-item span {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }
        .edit-audio-item button {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-large {
            display: block;
            width: 100%;
            background-color: var(--surface-color);
            color: var(--text-main);
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid var(--primary-color);
            margin-bottom: 20px;
            cursor: pointer;
        }

        .play-nav { display: flex; justify-content: space-between; gap: 10px; }
        .nav-btn {
            flex: 1;
            background-color: #333;
            color: white;
            border: none;
            padding: 20px 10px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 1.2rem; color: var(--text-sec); }
        input[type="text"], input[type="url"], textarea {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
        textarea { height: 150px; resize: none; }
        
        input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: var(--surface-color);
            border: 1px dashed var(--primary-color);
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .action-btns { display: flex; gap: 15px; }
        .btn-save { flex: 2; background-color: var(--primary-color); color: #000; border: none; font-weight: bold;}
        .btn-cancel { flex: 1; background-color: #555; color: white; border: none; }
        .btn-delete { width: 100%; background-color: var(--danger); color: white; border: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; display: none;}
        
        #loadingSpinner {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            color: var(--primary-color);
            z-index: 20000;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            flex-direction: column;
        }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sec);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="loadingSpinner">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 15px;"></i>
        <span id="spinnerText">מעלה קבצים...</span>
    </div>

    <header>
        <div class="header-content">
            <img src="logo.png" alt="לוגו" style="height: 55px; border-radius: 50%;" onerror="this.style.display='none'; document.getElementById('fallbackIcon').style.display='inline-block';">
            <i id="fallbackIcon" class="fa-solid fa-microphone-lines" style="display: none; font-size: 2rem; color: var(--primary-color);"></i>
            <h1>חמישי הרכב - השירים שלנו</h1>
        </div>
        <div id="connectionStatus" class="status-badge">אחסון מקומי פעיל</div>
    </header>

    <div id="listScreen" class="screen active">
        
        <div class="tools-bar">
            <button class="tool-btn" onclick="window.exportToCSV()">
                <i class="fa-solid fa-file-excel"></i> יצוא ל-CSV
            </button>
            <button class="tool-btn" onclick="window.triggerImportCSV()">
                <i class="fa-solid fa-file-import"></i> יבוא מ-CSV
            </button>
            <input type="file" id="importCsvInput" accept=".csv" style="display: none;" onchange="window.importFromCSV(event)">
        </div>

        <ul class="song-list" id="songList"></ul>
        <button class="fab" id="fabAddBtn" onclick="window.openEditScreen(null)" aria-label="הוסף שיר">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <div id="detailScreen" class="screen">
        <div class="detail-header">
            <h2 class="detail-title" id="detTitle">שם השיר</h2>
            <button onclick="window.openEditScreen(window.currentSongId)" style="background:none; border:none; color:var(--text-sec); font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-pen"></i> ערוך שיר</button>
        </div>

        <div class="info-grid">
            <div class="info-box">
                <span>סולם</span>
                <strong id="detKey">Am</strong>
            </div>
            <div class="info-box">
                <span>סולם מקורי</span>
                <strong id="detOrigKey">Am</strong>
            </div>
            <div class="info-box">
                <span>שינוי טון</span>
                <strong id="detShift">-1</strong>
            </div>
        </div>

        <label>דגשים לנגינה:</label>
        <div class="notes-section" id="detNotes"></div>

        <div id="detAudioContainer" class="audio-list-container"></div>

        <a href="#" target="_blank" class="btn-large" id="detLink">
            <i class="fa-solid fa-file-pdf"></i> אקורדים / TAB4U
        </a>

        <div class="play-nav">
            <button class="nav-btn" onclick="window.prevSong()"><i class="fa-solid fa-backward"></i> הקודם</button>
            <button class="nav-btn" onclick="window.showScreen('listScreen')"><i class="fa-solid fa-list"></i> רשימה</button>
            <button class="nav-btn" onclick="window.nextSong()">הבא <i class="fa-solid fa-forward"></i></button>
        </div>
    </div>

    <div id="editScreen" class="screen">
        <h2 id="editHeader" style="margin-bottom: 20px; color:var(--primary-color);">הוספת שיר חדש</h2>
        <input type="hidden" id="editId">

        <div class="play-nav" style="margin-bottom: 25px;">
            <button class="nav-btn" onclick="window.editPrevSong()"><i class="fa-solid fa-backward"></i> הקודם</button>
            <button class="nav-btn" onclick="window.showScreen('listScreen')"><i class="fa-solid fa-list"></i> רשימה</button>
            <button class="nav-btn" onclick="window.editNextSong()">הבא <i class="fa-solid fa-forward"></i></button>
        </div>
        
        <div class="form-group">
            <label>שם השיר</label>
            <input type="text" id="editTitle" placeholder="לדוגמה: צל כבד">
        </div>

        <div class="info-grid">
            <div class="form-group">
                <label>סולם</label>
                <input type="text" id="editKey" placeholder="Am..." dir="ltr">
            </div>
            <div class="form-group">
                <label>סולם מקורי</label>
                <input type="text" id="editOrigKey" placeholder="Am..." dir="ltr">
            </div>
            <div class="form-group">
                <label>שינוי טון</label>
                <input type="text" id="editShift" placeholder="-1..." dir="ltr">
            </div>
        </div>

        <div class="form-group">
            <label>דגשים לנגינה</label>
            <textarea id="editNotes" placeholder="מי מתחיל? איזה מקצב?"></textarea>
        </div>

        <div class="form-group">
            <label>קישור (TAB4U / דרייב / PDF)</label>
            <input type="url" id="editLink" placeholder="https://..." dir="ltr">
        </div>

        <div class="form-group" style="background-color: #252525; padding: 15px; border-radius: 10px;">
            <label style="color: var(--primary-color);"><i class="fa-brands fa-youtube"></i> קישור לשיר (YouTube / Spotify)</label>
            <div style="display: flex; gap: 10px;">
                <input type="url" id="editMediaLinkInput" placeholder="https://..." dir="ltr" style="flex:1;">
                <button type="button" onclick="window.addMediaLink()" style="flex: 0 0 auto; background-color: var(--primary-color); color:#000; border:none; border-radius:8px; padding: 0 20px; font-size:1.3rem; cursor:pointer;"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="editAudioList"></div>
        </div>

        <div class="action-btns">
            <button class="nav-btn btn-save" onclick="window.saveSong()"><i class="fa-solid fa-check"></i> שמור</button>
            <button class="nav-btn btn-cancel" onclick="window.showScreen('listScreen')">ביטול</button>
        </div>
        
        <button class="btn-delete" id="btnDelete" onclick="window.deleteSong()"><i class="fa-solid fa-trash"></i> מחק שיר</button>
    </div>

    <script>
        // === 1. הגדרות Firebase / אחסון מקומי ===
       const firebaseConfig = {
  apiKey: "AIzaSyDz8r57lSTlq4W4PUrJwk1XLqfGw_6d0EQ",
  authDomain: "hamishi-27cb2.firebaseapp.com",
  projectId: "hamishi-27cb2",
  storageBucket: "hamishi-27cb2.firebasestorage.app",
  messagingSenderId: "291004279844",
  appId: "1:291004279844:web:ab3679d6f926677333bcb1"
};
        let db = null;
        let songs = [];
        window.currentSongId = null;
        let tempMediaLinks = [];

        // טעינת שירים מ-LocalStorage במקרה שאין Firebase
        function loadLocalSongs() {
            try {
                const localData = localStorage.getItem('acoustic_songs');
                if (localData) {
                    songs = JSON.parse(localData);
                } else {
                    songs = [];
                }
            } catch (e) {
                console.error("Local storage read error", e);
                songs = [];
            }
        }

        function saveLocalSongs() {
            try {
                localStorage.setItem('acoustic_songs', JSON.stringify(songs));
            } catch (e) {
                console.error("Local storage save error", e);
            }
        }

        // בדיקה והגדרת Firebase
        // הערה: אחסון קבצים (Firebase Storage) אינו נדרש יותר כי צירוף השירים
        // הוא כעת קישור (YouTube/Spotify) ולא קובץ מועלה. לכן מאתחלים רק Firestore,
        // כדי שתקלה כלשהי ב-Storage לא תפיל את החיבור לבסיס הנתונים.
        try {
            if (typeof firebase !== 'undefined' && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("החלף")) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();

                const statusEl = document.getElementById('connectionStatus');

                db.collection("songs").onSnapshot((snapshot) => {
                    songs = [];
                    snapshot.forEach((doc) => {
                        songs.push({ id: doc.id, ...doc.data() });
                    });
                    saveLocalSongs();
                    renderList();
                    if (window.currentSongId) {
                        const updatedCurrent = songs.find(s => s.id === window.currentSongId);
                        if (updatedCurrent) openDetailScreen(window.currentSongId);
                    }
                    if (statusEl) {
                        statusEl.innerText = "מחובר לסנכרון ענן (Firebase)";
                        statusEl.style.color = "#2ecc71";
                    }
                }, (err) => {
                    // שגיאת חיבור/הרשאות מול Firestore (למשל כללי אבטחה חוסמים) -
                    // חוזרים לאחסון מקומי כדי שהאפליקציה תמשיך לעבוד
                    console.error("Firestore snapshot error:", err);
                    db = null;
                    if (statusEl) {
                        statusEl.innerText = "שגיאת חיבור לענן - עובד במצב מקומי (" + (err.code || err.message) + ")";
                        statusEl.style.color = "#e74c3c";
                    }
                    loadLocalSongs();
                    renderList();
                });
            } else {
                console.log("Firebase not configured. Running in Local Storage mode.");
                const statusEl = document.getElementById('connectionStatus');
                if (statusEl) {
                    statusEl.innerText = "מצב מקומי (ללא סנכרון ענן)";
                }
                loadLocalSongs();
            }
        } catch (err) {
            console.error("Firebase init error:", err);
            db = null;
            const statusEl = document.getElementById('connectionStatus');
            if (statusEl) {
                statusEl.innerText = "שגיאת חיבור לענן - עובד במצב מקומי";
                statusEl.style.color = "#e74c3c";
            }
            loadLocalSongs();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        let songListSortable = null;

        // ממיין את מערך השירים לפי שדה order (שירים ללא order יורדים לסוף לפי סדר קיים)
        function sortSongsByOrder() {
            songs.forEach((s, idx) => {
                if (typeof s.order !== 'number') s.order = idx + 1000; // דוחף שירים ללא order לסוף
            });
            songs.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        }

        function renderList() {
            const list = document.getElementById('songList');
            if (!list) return;

            sortSongsByOrder();
            list.innerHTML = '';
            
            if (songs.length === 0) {
                list.innerHTML = `<li style="text-align:center; color: var(--text-sec); padding: 40px 10px; font-size: 1.2rem;">אין עדיין שירים.<br>לחץ על כפתור הפלוס (+) למטה כדי להוסיף שיר ראשון, או יבא רשימה מ-CSV!</li>`;
                return;
            }
            
            songs.forEach(song => {
                const li = document.createElement('li');
                li.className = 'song-card';
                li.dataset.id = song.id;
                li.onclick = () => window.openDetailScreen(song.id);
                li.innerHTML = `
                    <div class="song-title-wrap">
                        <i class="fa-solid fa-grip-lines drag-handle" onclick="event.stopPropagation()"></i>
                        <span class="song-title">${escapeHtml(song.title || 'שיר ללא שם')}</span>
                    </div>
                    <span class="song-key-badge">${escapeHtml(song.key || '-')}</span>
                `;
                list.appendChild(li);
            });

            initSongListSortable();
        }

        // מאפשר לכל אחד מחברי ההרכב לסדר מחדש את רשימת השירים בגרירה
        function initSongListSortable() {
            const list = document.getElementById('songList');
            if (!list || typeof Sortable === 'undefined') return;

            if (songListSortable) {
                songListSortable.destroy();
                songListSortable = null;
            }

            songListSortable = Sortable.create(list, {
                handle: '.drag-handle',
                animation: 150,
                delay: 0,
                onEnd: handleSongReorder
            });
        }

        async function handleSongReorder() {
            const list = document.getElementById('songList');
            if (!list) return;

            const newIdOrder = Array.from(list.children)
                .map(li => li.dataset.id)
                .filter(Boolean);

            if (newIdOrder.length === 0) return;

            newIdOrder.forEach((id, index) => {
                const song = songs.find(s => s.id === id);
                if (song) song.order = index;
            });
            songs.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

            if (db) {
                try {
                    showSpinner("שומר סדר חדש...");
                    const batch = db.batch();
                    newIdOrder.forEach((id, index) => {
                        batch.update(db.collection("songs").doc(id), { order: index });
                    });
                    await batch.commit();
                    hideSpinner();
                } catch (err) {
                    console.error("Error saving song order:", err);
                    hideSpinner();
                    alert("שגיאה בשמירת הסדר: " + err.message);
                }
            } else {
                saveLocalSongs();
            }
        }

        // מזהה קישורי YouTube / Spotify ומחזיר פרטי הטמעה (embed), אחרת null
        function getMediaEmbed(url) {
            if (!url) return null;
            try {
                const u = new URL(url);
                const host = u.hostname.replace('www.', '');

                // YouTube
                if (host === 'youtu.be') {
                    const id = u.pathname.slice(1);
                    if (id) return { type: 'youtube', embedUrl: `https://www.youtube.com/embed/${id}` };
                }
                if (host === 'youtube.com' || host === 'm.youtube.com') {
                    if (u.pathname === '/watch') {
                        const id = u.searchParams.get('v');
                        if (id) return { type: 'youtube', embedUrl: `https://www.youtube.com/embed/${id}` };
                    }
                    if (u.pathname.startsWith('/shorts/')) {
                        const id = u.pathname.split('/')[2];
                        if (id) return { type: 'youtube', embedUrl: `https://www.youtube.com/embed/${id}` };
                    }
                    if (u.pathname.startsWith('/embed/')) {
                        return { type: 'youtube', embedUrl: url };
                    }
                }

                // Spotify
                if (host === 'open.spotify.com') {
                    if (u.pathname.startsWith('/embed/')) {
                        return { type: 'spotify', embedUrl: url };
                    }
                    return { type: 'spotify', embedUrl: `https://open.spotify.com/embed${u.pathname}` };
                }
            } catch (e) {
                return null;
            }
            return null;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function openDetailScreen(id) {
            window.currentSongId = id;
            const song = songs.find(s => s.id === id);
            if (!song) return;

            document.getElementById('detTitle').innerText = song.title || "שיר ללא שם";
            document.getElementById('detKey').innerText = song.key || "-";
            document.getElementById('detOrigKey').innerText = song.origKey || "-";
            document.getElementById('detShift').innerText = song.shift || "0";
            document.getElementById('detNotes').innerText = song.notes || "אין דגשים מיוחדים.";
            
            const linkBtn = document.getElementById('detLink');
            if (song.link) {
                linkBtn.style.display = 'block';
                linkBtn.href = song.link;
            } else {
                linkBtn.style.display = 'none';
            }

            const audioContainer = document.getElementById('detAudioContainer');
            audioContainer.innerHTML = '';
            const mediaLinks = song.mediaLinks || [];
            if (mediaLinks.length > 0) {
                mediaLinks.forEach(item => {
                    const mediaDiv = document.createElement('div');
                    mediaDiv.className = 'audio-item';
                    const embed = getMediaEmbed(item.url);

                    if (embed && embed.type === 'youtube') {
                        mediaDiv.innerHTML = `
                            <span><i class="fa-brands fa-youtube"></i> YouTube</span>
                            <iframe src="${embed.embedUrl}" height="220" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        `;
                    } else if (embed && embed.type === 'spotify') {
                        mediaDiv.innerHTML = `
                            <span><i class="fa-brands fa-spotify"></i> Spotify</span>
                            <iframe src="${embed.embedUrl}" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
                        `;
                    } else {
                        mediaDiv.innerHTML = `
                            <span><i class="fa-solid fa-headphones"></i> קישור להאזנה</span>
                            <a class="media-link-btn" href="${item.url}" target="_blank" rel="noopener">פתח קישור <i class="fa-solid fa-arrow-up-left-from-square"></i></a>
                        `;
                    }
                    audioContainer.appendChild(mediaDiv);
                });
                audioContainer.style.display = 'block';
            } else {
                audioContainer.style.display = 'none';
            }

            showScreen('detailScreen');
        }

        function openEditScreen(id = null) {
            const isEdit = id !== null && id !== undefined && id !== '';
            document.getElementById('editHeader').innerText = isEdit ? "עריכת שיר" : "הוספת שיר חדש";
            document.getElementById('btnDelete').style.display = isEdit ? 'block' : 'none';
            
            const linkInput = document.getElementById('editMediaLinkInput');
            if (linkInput) linkInput.value = '';

            tempMediaLinks = [];

            if (isEdit) {
                const song = songs.find(s => s.id === id);
                if (song) {
                    document.getElementById('editId').value = song.id;
                    document.getElementById('editTitle').value = song.title || '';
                    document.getElementById('editKey').value = song.key || '';
                    document.getElementById('editOrigKey').value = song.origKey || '';
                    document.getElementById('editShift').value = song.shift || '';
                    document.getElementById('editNotes').value = song.notes || '';
                    document.getElementById('editLink').value = song.link || '';
                    if (song.mediaLinks) tempMediaLinks = [...song.mediaLinks];
                }
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('editTitle').value = '';
                document.getElementById('editKey').value = '';
                document.getElementById('editOrigKey').value = '';
                document.getElementById('editShift').value = '';
                document.getElementById('editNotes').value = '';
                document.getElementById('editLink').value = '';
            }
            
            renderEditAudioList();
            showScreen('editScreen');
        }

        function renderEditAudioList() {
            const list = document.getElementById('editAudioList');
            if (!list) return;
            list.innerHTML = '';
            tempMediaLinks.forEach((item, index) => {
                const embed = getMediaEmbed(item.url);
                const icon = embed && embed.type === 'youtube' ? 'fa-brands fa-youtube'
                           : embed && embed.type === 'spotify' ? 'fa-brands fa-spotify'
                           : 'fa-solid fa-link';
                const div = document.createElement('div');
                div.className = 'edit-audio-item';
                div.innerHTML = `
                    <span style="color: #fff;"><i class="${icon}"></i><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(item.url)}</span></span>
                    <button type="button" onclick="window.removeTempMediaLink(${index})"><i class="fa-solid fa-trash"></i> הסר</button>
                `;
                list.appendChild(div);
            });
        }

        function addMediaLink() {
            const input = document.getElementById('editMediaLinkInput');
            if (!input) return;
            const url = input.value.trim();
            if (!url) return;

            try {
                new URL(url);
            } catch (e) {
                alert("אנא הזן קישור תקין (כולל https://)");
                return;
            }

            tempMediaLinks.push({ url });
            input.value = '';
            renderEditAudioList();
        }

        function removeTempMediaLink(index) {
            tempMediaLinks.splice(index, 1);
            renderEditAudioList();
        }

        async function saveSong() {
            const id = document.getElementById('editId').value;
            const titleInput = document.getElementById('editTitle').value.trim();
            
            if (!titleInput) {
                alert("אנא הזן שם לשיר");
                return;
            }

            // אם הוקלד קישור בשדה אך המשתמש לא לחץ "הוסף", נוסיף אותו אוטומטית לפני השמירה
            const pendingLinkInput = document.getElementById('editMediaLinkInput');
            if (pendingLinkInput && pendingLinkInput.value.trim()) {
                addMediaLink();
            }

            showSpinner("שומר שיר...");

            try {
                const songData = {
                    title: titleInput,
                    key: document.getElementById('editKey').value || "-",
                    origKey: document.getElementById('editOrigKey').value || "-",
                    shift: document.getElementById('editShift').value || "0",
                    notes: document.getElementById('editNotes').value || "",
                    link: document.getElementById('editLink').value || "",
                    mediaLinks: [...tempMediaLinks]
                };

                if (db) {
                    if (id) {
                        await db.collection("songs").doc(id).update(songData);
                        const index = songs.findIndex(s => s.id === id);
                        if (index !== -1) {
                            const existingOrder = songs[index].order;
                            songs[index] = { id, order: existingOrder, ...songData };
                        }
                    } else {
                        songData.order = songs.length;
                        const docRef = await db.collection("songs").add(songData);
                        window.currentSongId = docRef.id;
                        songs.push({ id: docRef.id, ...songData });
                    }
                    saveLocalSongs();
                    renderList();
                } else {
                    if (id) {
                        const existing = songs.find(s => s.id === id);
                        const index = songs.findIndex(s => s.id === id);
                        if (index !== -1) {
                            songs[index] = { id, order: existing ? existing.order : songs.length, ...songData };
                        }
                    } else {
                        const newId = "local_" + Date.now();
                        songs.push({ id: newId, order: songs.length, ...songData });
                        window.currentSongId = newId;
                    }
                    saveLocalSongs();
                    renderList();
                }

                hideSpinner();
                showScreen('listScreen');
            } catch (error) {
                console.error("Error saving song:", error);
                alert("שגיאה בשמירה: " + error.message);
                hideSpinner();
            }
        }

        async function deleteSong() {
            const id = document.getElementById('editId').value;
            if (!id) return;
            
            if (confirm("בטוח שברצונך למחוק את השיר?")) {
                showSpinner("מוחק...");
                try {
                    if (db) {
                        await db.collection("songs").doc(id).delete();
                        songs = songs.filter(s => s.id !== id);
                        saveLocalSongs();
                        renderList();
                    } else {
                        songs = songs.filter(s => s.id !== id);
                        saveLocalSongs();
                        renderList();
                    }
                    hideSpinner();
                    showScreen('listScreen');
                } catch(error) {
                    alert("שגיאה במחיקה: " + error.message);
                    hideSpinner();
                }
            }
        }

        // === 2. יצוא נתונים ל-CSV (טבלה) ===
        function exportToCSV() {
            if (songs.length === 0) {
                alert("אין שירים ברשימה ליצוא.");
                return;
            }

            const headers = ["שם השיר", "סולם", "סולם מקורי", "שינוי טון", "דגשים לנגינה", "קישור", "קישורי מדיה (מופרדים ב-|)", "סדר"];
            let csvContent = "\uFEFF";

            const escapeCSV = (str) => {
                if (str === null || str === undefined) return '""';
                let text = String(str).replace(/"/g, '""');
                return `"${text}"`;
            };

            csvContent += headers.map(escapeCSV).join(",") + "\r\n";

            sortSongsByOrder();
            songs.forEach((song, idx) => {
                const mediaLinksStr = (song.mediaLinks || []).map(m => m.url).join("|");
                const row = [
                    song.title || "",
                    song.key || "",
                    song.origKey || "",
                    song.shift || "",
                    song.notes || "",
                    song.link || "",
                    mediaLinksStr,
                    (typeof song.order === 'number' ? song.order : idx)
                ];
                csvContent += row.map(escapeCSV).join(",") + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Acoustic_Songs_${new Date().toISOString().slice(0, 10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // === 3. יבוא נתונים מ-CSV (טבלה) ===
        function triggerImportCSV() {
            document.getElementById('importCsvInput').click();
        }

        function parseCSV(text) {
            const lines = [];
            let row = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(current.trim());
                    current = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') {
                        i++;
                    }
                    row.push(current.trim());
                    if (row.length > 0 && row.some(cell => cell !== '')) {
                        lines.push(row);
                    }
                    row = [];
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current || row.length > 0) {
                row.push(current.trim());
                if (row.some(cell => cell !== '')) {
                    lines.push(row);
                }
            }
            return lines;
        }

        async function importFromCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    let text = e.target.result;
                    if (text.startsWith('\uFEFF')) {
                        text = text.substring(1);
                    }

                    const rows = parseCSV(text);
                    if (rows.length < 2) {
                        alert("הקובץ ריק או אינו מכיל נתונים תקינים.");
                        return;
                    }

                    const dataRows = rows.slice(1);
                    let addedCount = 0;
                    let orderCursor = songs.length;

                    showSpinner("מיבא שירים לטבלה...");

                    for (const row of dataRows) {
                        if (!row[0]) continue;

                        const mediaLinksStr = row[6] || "";
                        const mediaLinks = mediaLinksStr
                            ? mediaLinksStr.split("|").map(u => u.trim()).filter(Boolean).map(url => ({ url }))
                            : [];
                        const parsedOrder = parseInt(row[7], 10);

                        const songData = {
                            title: row[0] || "שיר ללא שם",
                            key: row[1] || "-",
                            origKey: row[2] || "-",
                            shift: row[3] || "0",
                            notes: row[4] || "",
                            link: row[5] || "",
                            mediaLinks: mediaLinks,
                            order: Number.isFinite(parsedOrder) ? parsedOrder : orderCursor++
                        };

                        if (db) {
                            const docRef = await db.collection("songs").add(songData);
                            songs.push({ id: docRef.id, ...songData });
                        } else {
                            songData.id = "local_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5);
                            songs.push(songData);
                        }
                        addedCount++;
                    }

                    saveLocalSongs();
                    renderList();

                    hideSpinner();
                    alert(`יבוא הנתונים הושלם בהצלחה! נוספו ${addedCount} שירים.`);
                } catch (err) {
                    console.error("Error importing CSV:", err);
                    hideSpinner();
                    alert("שגיאה ביבוא קובץ ה-CSV: " + err.message);
                } finally {
                    event.target.value = '';
                }
            };

            reader.readAsText(file, 'UTF-8');
        }

        function showSpinner(text) {
            document.getElementById('spinnerText').innerText = text;
            document.getElementById('loadingSpinner').style.display = 'flex';
        }

        function hideSpinner() {
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function nextSong() {
            const index = songs.findIndex(s => s.id === window.currentSongId);
            if (index < songs.length - 1) window.openDetailScreen(songs[index + 1].id);
        }

        function prevSong() {
            const index = songs.findIndex(s => s.id === window.currentSongId);
            if (index > 0) window.openDetailScreen(songs[index - 1].id);
        }

        // בודק האם יש שינויים שלא נשמרו בטופס העריכה ביחס לשיר המקורי
        function isEditFormDirty(song) {
            if (!song) return false;
            const currentMediaLinks = JSON.stringify(tempMediaLinks);
            const originalMediaLinks = JSON.stringify(song.mediaLinks || []);
            return (
                document.getElementById('editTitle').value !== (song.title || '') ||
                document.getElementById('editKey').value !== (song.key || '') ||
                document.getElementById('editOrigKey').value !== (song.origKey || '') ||
                document.getElementById('editShift').value !== (song.shift || '') ||
                document.getElementById('editNotes').value !== (song.notes || '') ||
                document.getElementById('editLink').value !== (song.link || '') ||
                currentMediaLinks !== originalMediaLinks
            );
        }

        // מעבר לשיר הקודם/הבא ישירות ממסך העריכה, כדי לא לחייב חזרה לרשימה בין כל שיר
        function navigateEditSong(direction) {
            const id = document.getElementById('editId').value;
            if (!id) {
                alert("יש לשמור את השיר החדש (או ללחוץ ביטול) לפני מעבר לשיר אחר.");
                return;
            }
            const index = songs.findIndex(s => s.id === id);
            if (index === -1) return;

            const targetIndex = index + direction;
            if (targetIndex < 0) {
                alert("זהו השיר הראשון ברשימה.");
                return;
            }
            if (targetIndex >= songs.length) {
                alert("זהו השיר האחרון ברשימה.");
                return;
            }

            const currentSong = songs.find(s => s.id === id);
            if (isEditFormDirty(currentSong) && !confirm("יש שינויים שלא נשמרו בשיר הנוכחי. לעבור בכל זאת ולאבד אותם?")) {
                return;
            }

            window.openEditScreen(songs[targetIndex].id);
        }

        function editPrevSong() { navigateEditSong(-1); }
        function editNextSong() { navigateEditSong(1); }

        // === חשיפה ל-Global Scope (מונע את חסימת המיניפיקציה של Netlify) ===
        window.openEditScreen = openEditScreen;
        window.openDetailScreen = openDetailScreen;
        window.showScreen = showScreen;
        window.saveSong = saveSong;
        window.deleteSong = deleteSong;
        window.exportToCSV = exportToCSV;
        window.triggerImportCSV = triggerImportCSV;
        window.importFromCSV = importFromCSV;
        window.nextSong = nextSong;
        window.prevSong = prevSong;
        window.editPrevSong = editPrevSong;
        window.editNextSong = editNextSong;
        window.addMediaLink = addMediaLink;
        window.removeTempMediaLink = removeTempMediaLink;

        // הפעלה בטוחה ללא תלות באירועי טעינה מוקדמים או מאוחרים
        setTimeout(() => {
            if (!db) {
                loadLocalSongs();
            }
            renderList();
        }, 50);

    </script>
